name: Scanverity Resolution API rate limits
description: >-
  Per-token, per-minute limits split into two buckets -- reads and assessment requests -- with
  different ceilings in the live and sandbox environments. The full RateLimit-* header family is
  declared on every operation in the contract, so the runtime signal is available to an agent on
  success responses, not only on 429.
docs: https://scanverity.com/resolution-api/docs
limit_count: 4
window: 60 seconds
scope: per-token (with a shared per-account bound also referenced)
buckets:
  - name: read
    description: Reads and polls of assessments, usage and webhook records.
  - name: request
    description: Assessment creation.
limits:
  - environment: live
    bucket: read
    scope: per-token
    window: 60s
    limit: 120
    unit: requests
  - environment: live
    bucket: request
    scope: per-token
    window: 60s
    limit: 60
    unit: requests
  - environment: sandbox
    bucket: read
    scope: per-token
    window: 60s
    limit: 30
    unit: requests
  - environment: sandbox
    bucket: request
    scope: per-token
    window: 60s
    limit: 10
    unit: requests
response_headers:
