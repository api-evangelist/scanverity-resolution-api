apis:
  - name: Scanverity Resolution API
    description: >-
      REST API (OpenAPI 3.1, contract v1.3.0-private-beta) for resolution-risk assessment on
      prediction markets. Versioned under /v1, JSON bodies, HTTP Bearer auth with reveal-once
      environment-bound tokens (svr_live_ / svr_sandbox_ prefixes), an async create-and-poll model
      with three terminal states (released, withheld, failed), signed HMAC-SHA256 webhooks with
      append-only delivery evidence, and a cursor-paginated reconciled usage ledger. Private beta
      and feature-gated.
