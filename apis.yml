name: Scanverity Resolution API
description: >-
  An independent Polymarket intelligence platform, operated by KotIQ OÜ, providing resolution-risk
  assessments on prediction markets through a documented OpenAPI 3.1 REST API. Resolution risk is
  the chance a market settles in a way its title does not lead a reader to expect — ambiguous rule
  language, an unverifiable resolution source, or a title that diverges from the rules. The API is
  an async create-and-poll surface with signed webhooks, a deterministic sandbox fixture catalog, a
  reconciled usage ledger, four deny-by-default token scopes and a required Idempotency-Key on its
  only billable write. The contract, an APIs.json index and an RFC 9727 api-catalog are all publicly
  retrievable; runtime access is private beta and feature-gated, so live calls require an entitled,
  allowlisted account. Read-only research only — no order placement, no custody, no trading advice.
