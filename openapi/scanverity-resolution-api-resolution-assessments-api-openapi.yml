openapi: 3.2.0
info:
  title: Scanverity Resolution Resolution assessments API
  version: 1.3.0-private-beta
  summary: Feature-gated API for resolution-risk assessments, reconciled usage, deterministic sandbox fixtures and signed webhooks.
  description: Contract for the implemented private-beta assessment, reconciled-usage, deterministic-sandbox and signed-webhook slice. This document does not assert that the feature flag is enabled in production. It does not provide outcome, trading, investment or position advice. Capabilities marked NOT_YET_AVAILABLE are roadmap vocabulary, not callable operations.
  contact:
    name: Scanverity Intelligence support
    url: https://scanverity.com/contact
    email: research@scanverity.com
servers:
- url: https://scanverity.com
  description: Production origin. Access is private-beta and feature-gated; availability is not implied by this specification.
security:
- bearerToken: []
tags:
- name: Resolution assessments
  description: Create and poll account-scoped assessment resources.
paths:
  /v1/resolution-assessments:
    post:
      operationId: createResolutionAssessment
      tags:
      - Resolution assessments
      summary: Request an assessment of one market
      description: Requires resolution:request. A valid request creates an accepted resource and schedules assessment work. Replaying the same live idempotency key and canonical payload returns the existing resource with HTTP 202. An svr_sandbox_ token uses only the closed deterministic sandbox catalog and every sandbox result is non-billable. webhook=true requires at least one active pre-registered endpoint in the same account and token environment; inline webhook URLs are never accepted.
      x-required-scope: resolution:request
      x-availability: IMPLEMENTED_FEATURE_GATED
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssessmentRequest'
            examples:
              marketId:
                summary: Request by stable market identifier
                value:
                  market: '1105752'
                  customer_reference: case-2026-08-03
              deterministicSandbox:
                summary: Non-billable fixed sandbox fixture
                value:
                  market: sv-sandbox-released-calibrated
                  customer_reference: sandbox-contract-test
              withSignedWebhook:
                summary: Deliver the terminal resource to matching registered endpoints
                value:
                  market: '1105752'
                  customer_reference: case-with-webhook
                  webhook: true
      responses:
        '202':
          description: Newly accepted or idempotently replayed. A replay returns the resource's current state but never creates a second resource or assessment run.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            RateLimit-Scope:
              $ref: '#/components/headers/RateLimit-Scope'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
              examples:
                accepted:
                  $ref: '#/components/examples/AcceptedAssessment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          description: The same account, token and unexpired idempotency key were used with a different canonical payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: This Idempotency-Key was already used with a different payload.
        '413':
          description: The JSON request body exceeds 8 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_REQUEST
                  message: The request body is not valid for this endpoint.
                  detail: The request body exceeds 8 KiB.
        '422':
          description: The market is unsupported, or webhook delivery was requested without an active endpoint in the same account and environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupportedMarket:
                  value:
                    error:
                      code: UNSUPPORTED_MARKET
                      message: The market is outside Scanverity's tracked assessment universe.
                webhookNotConfigured:
                  value:
                    error:
                      code: WEBHOOK_NOT_CONFIGURED
                      message: Webhook delivery requires a pre-registered webhook endpoint.
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /v1/resolution-assessments/{assessment_id}:
    get:
      operationId: getResolutionAssessment
      tags:
      - Resolution assessments
      summary: Read or poll one assessment
      description: Requires resolution:read. The assessment must belong to the token's account. Reading and polling are never billable.
      x-required-scope: resolution:read
      x-availability: IMPLEMENTED_FEATURE_GATED
      parameters:
      - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: The assessment in its current state.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            RateLimit-Scope:
              $ref: '#/components/headers/RateLimit-Scope'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
              examples:
                accepted:
                  $ref: '#/components/examples/AcceptedAssessment'
                processing:
                  $ref: '#/components/examples/ProcessingAssessment'
                releasedBillable:
                  $ref: '#/components/examples/ReleasedBillableAssessment'
                releasedEvaluationCredit:
                  $ref: '#/components/examples/ReleasedEvaluationCreditAssessment'
                releasedMeasurement:
                  $ref: '#/components/examples/ReleasedMeasurementAssessment'
                releasedCacheHit:
                  $ref: '#/components/examples/ReleasedCacheHitAssessment'
                sandboxReleased:
                  $ref: '#/components/examples/SandboxReleasedAssessment'
                withheld:
                  $ref: '#/components/examples/WithheldAssessment'
                failed:
                  $ref: '#/components/examples/FailedAssessment'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          description: The identifier is unknown or belongs to another account; both cases have the same response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_FOUND
                  message: The requested assessment was not found.
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    Assessment:
      oneOf:
      - $ref: '#/components/schemas/AssessmentAccepted'
      - $ref: '#/components/schemas/AssessmentProcessing'
      - $ref: '#/components/schemas/AssessmentReleased'
      - $ref: '#/components/schemas/AssessmentWithheld'
      - $ref: '#/components/schemas/AssessmentFailed'
      discriminator:
        propertyName: status
    ReceiptReference:
      type: object
      additionalProperties: false
      required:
      - receipt_id
      - url
      properties:
        receipt_id:
          type: string
        url:
          type: string
          format: uri
    MeteringBillable:
      type: object
      additionalProperties: false
      required:
      - disposition
      - usage_event_id
      properties:
        disposition:
          const: billable
        usage_event_id:
          type: string
          minLength: 1
    EvidenceFreshness:
      type: object
      additionalProperties: false
      properties:
        rules_as_of:
          type:
          - string
          - 'null'
          format: date-time
        book_as_of:
          type:
          - string
          - 'null'
          format: date-time
        universe_as_of:
          type:
          - string
          - 'null'
          format: date-time
    MeteringSandbox:
      type: object
      additionalProperties: false
      required:
      - disposition
      properties:
        disposition:
          const: sandbox
    Market:
      type: object
      additionalProperties: false
      required:
      - market_id
      - title
      - condition_id
      - slug
      properties:
        market_id:
          type: string
        title:
          type: string
        condition_id:
          type:
          - string
          - 'null'
          pattern: ^0x[a-f0-9]{64}$
        slug:
          type:
          - string
          - 'null'
        canonical_url:
          type: string
          format: uri
    EvidenceSnapshot:
      type: object
      additionalProperties: false
      required:
      - sha256
      - book_as_of
      - universe_as_of
      properties:
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        book_as_of:
          type: string
          format: date-time
        universe_as_of:
          type: string
          format: date-time
    Metering:
      oneOf:
      - $ref: '#/components/schemas/MeteringBillable'
      - $ref: '#/components/schemas/MeteringEvaluationCredit'
      - $ref: '#/components/schemas/MeteringMeasurement'
      - $ref: '#/components/schemas/MeteringCacheHit'
      - $ref: '#/components/schemas/MeteringSandbox'
    RiskFactors:
      type: object
      additionalProperties: false
      required:
      - principal_reason_codes
      - exact_rule_fragments
      - alternative_interpretations
      properties:
        principal_reason_codes:
          type: array
          maxItems: 5
          items:
            type: string
        exact_rule_fragments:
          type: array
          maxItems: 5
          items:
            type: string
        alternative_interpretations:
          type: array
          maxItems: 5
          items:
            type: string
        title_rules_mismatch:
          type: boolean
        upcoming_critical_dates:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CriticalDate'
    MeteringCacheHit:
      type: object
      additionalProperties: false
      required:
      - disposition
      properties:
        disposition:
          const: cache_hit
    ModelledRisk:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        dispute_probability:
          $ref: '#/components/schemas/UnitInterval'
        ambiguity_score:
          $ref: '#/components/schemas/UnitInterval'
        source_reliability_score:
          $ref: '#/components/schemas/UnitInterval'
        timezone_risk:
          $ref: '#/components/schemas/UnitInterval'
        cancellation_risk:
          $ref: '#/components/schemas/UnitInterval'
    MeteringMeasurement:
      type: object
      additionalProperties: false
      required:
      - disposition
      - usage_event_id
      properties:
        disposition:
          const: measurement
        usage_event_id:
          type: string
          minLength: 1
    UnitInterval:
      type: number
      minimum: 0
      maximum: 1
    WithheldDetail:
      type: object
      additionalProperties: false
      required:
      - code
      - could_not_verify
      - reason
      properties:
        code:
          type: string
          x-extensible-enum:
          - WITHHELD_NO_RULES_TEXT
          - WITHHELD_NO_FINITE_ESTIMATE
          - WITHHELD_SOURCE_UNVERIFIED
        could_not_verify:
          type: string
        reason:
          type: string
        verified_facts:
          type: array
          items: {}
        retry:
          type: object
          additionalProperties: false
          properties:
            policy:
              type: string
        evidence_reference:
          type: string
    AssessmentProcessing:
      allOf:
      - $ref: '#/components/schemas/AssessmentCommon'
      - type: object
        properties:
          status:
            const: processing
          billable:
            const: false
    Provenance:
      type: object
      additionalProperties: false
      required:
      - record_schema
      - limitations
      properties:
        record_schema:
          type: string
        model_version:
          type: string
        limitations:
          type: array
          maxItems: 20
          items:
            type: string
        evidence_freshness:
          $ref: '#/components/schemas/EvidenceFreshness'
    AssessmentCommon:
      type: object
      required:
      - assessment_id
      - market_id
      - status
      - created_at
      - billable
      properties:
        assessment_id:
          $ref: '#/components/schemas/AssessmentId'
        market_id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
          - accepted
          - processing
          - released
          - withheld
          - failed
        created_at:
          type: string
          format: date-time
        billable:
          type: boolean
        customer_reference:
          type: string
          maxLength: 200
    AssessmentId:
      type: string
      pattern: ^ra_[a-f0-9]{32}$
      examples:
      - ra_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - INVALID_REQUEST
              - INVALID_MARKET
              - UNSUPPORTED_MARKET
              - INVALID_IDEMPOTENCY_KEY
              - IDEMPOTENCY_CONFLICT
              - WEBHOOK_NOT_CONFIGURED
              - INSUFFICIENT_SCOPE
              - INVALID_TOKEN
              - RATE_LIMITED
              - NOT_FOUND
              - METHOD_NOT_ALLOWED
              - PROVIDER_UNAVAILABLE
              - INTERNAL_ERROR
            message:
              type: string
            detail:
              type: string
              maxLength: 500
            docs_url:
              type: string
              format: uri
    VerifiedFact:
      type: object
      additionalProperties: false
      required:
      - kind
      - statement
      - as_of
      properties:
        kind:
          type: string
        statement:
          type: string
        as_of:
          type: string
          format: date-time
    CriticalDate:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date-time
        kind:
          type: string
        note:
          type: string
    ResolutionRisk:
      type: object
      additionalProperties: false
      required:
      - classification
      properties:
        classification:
          type: string
          description: Open classification vocabulary; clients must preserve unknown future values.
        risk_basis:
          type: string
        confidence:
          type: string
        modelled:
          $ref: '#/components/schemas/ModelledRisk'
        calibrated_estimate:
          oneOf:
          - $ref: '#/components/schemas/Calibration'
          - type: 'null'
          description: A measured null remains null. If the upstream record did not contain this key, it is omitted.
    AssessmentAccepted:
      allOf:
      - $ref: '#/components/schemas/AssessmentCommon'
      - type: object
        required:
        - status_url
        - polling
        properties:
          status:
            const: accepted
          billable:
            const: false
          status_url:
            type: string
            format: uri
          polling:
            $ref: '#/components/schemas/PollingGuidance'
    Calibration:
      type: object
      additionalProperties: true
      properties:
        p_cal:
          type: number
        ci_low:
          type: number
        ci_high:
          type: number
        bucket_n:
          type: number
        reliability:
          type: number
        base_rate:
          type: number
        model_version:
          type: string
    TerminalError:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          x-extensible-enum:
          - ASSESSMENT_FAILED
          - PROVIDER_UNAVAILABLE
          - INTERNAL_ERROR
        detail:
          type: string
        retryable:
          type: boolean
    AssessmentReleased:
      allOf:
      - $ref: '#/components/schemas/AssessmentCommon'
      - type: object
        required:
        - assessed_at
        - market
        - resolution_risk
        - risk_factors
        - provenance
        - metering
        properties:
          status:
            const: released
          assessed_at:
            type: string
            format: date-time
          market:
            $ref: '#/components/schemas/Market'
          resolution_risk:
            $ref: '#/components/schemas/ResolutionRisk'
          risk_factors:
            $ref: '#/components/schemas/RiskFactors'
          provenance:
            $ref: '#/components/schemas/Provenance'
          metering:
            $ref: '#/components/schemas/Metering'
          rules_snapshot:
            $ref: '#/components/schemas/RulesSnapshot'
          evidence_snapshot:
            $ref: '#/components/schemas/EvidenceSnapshot'
          verified_facts:
            type: array
            items:
              $ref: '#/components/schemas/VerifiedFact'
          receipt:
            $ref: '#/components/schemas/ReceiptReference'
        oneOf:
        - properties:
            billable:
              const: true
            metering:
              $ref: '#/components/schemas/MeteringBillable'
        - properties:
            billable:
              const: false
            metering:
              $ref: '#/components/schemas/MeteringEvaluationCredit'
        - properties:
            billable:
              const: false
            metering:
              $ref: '#/components/schemas/MeteringMeasurement'
        - properties:
            billable:
              const: false
            metering:
              $ref: '#/components/schemas/MeteringCacheHit'
        - properties:
            billable:
              const: false
            metering:
              $ref: '#/components/schemas/MeteringSandbox'
          not:
            required:
            - receipt
    MeteringEvaluationCredit:
      type: object
      additionalProperties: false
      required:
      - disposition
      - usage_event_id
      properties:
        disposition:
          const: evaluation_credit
        usage_event_id:
          type: string
          minLength: 1
    PollingGuidance:
      type: object
      additionalProperties: false
      required:
      - recommended_interval_seconds
      - typical_completion_seconds
      properties:
        recommended_interval_seconds:
          type: integer
          minimum: 1
          examples:
          - 3
        typical_completion_seconds:
          type: integer
          minimum: 1
          description: Indicative behavior, not a completion guarantee or service-level commitment.
          examples:
          - 10
    RulesSnapshot:
      type: object
      additionalProperties: false
      required:
      - sha256
      - captured_at
      properties:
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        captured_at:
          type: string
          format: date-time
    AssessmentWithheld:
      allOf:
      - $ref: '#/components/schemas/AssessmentCommon'
      - type: object
        required:
        - withheld
        properties:
          status:
            const: withheld
          billable:
            const: false
          withheld:
            $ref: '#/components/schemas/WithheldDetail'
          receipt:
            description: Present only when a public receipt was successfully published for a live withheld assessment. Omitted for sandbox assessments and whenever no receipt was published.
            allOf:
            - $ref: '#/components/schemas/ReceiptReference'
    AssessmentFailed:
      allOf:
      - $ref: '#/components/schemas/AssessmentCommon'
      - type: object
        required:
        - error
        properties:
          status:
            const: failed
          billable:
            const: false
          error:
            $ref: '#/components/schemas/TerminalError'
    CreateAssessmentRequest:
      type: object
      additionalProperties: false
      required:
      - market
      properties:
        market:
          type: string
          minLength: 1
          description: Stable Polymarket market identifier, supported slug, or supported canonical URL. It is normalized to one internal market identifier.
        customer_reference:
          type: string
          maxLength: 200
          description: Opaque customer correlation value. It is echoed and never interpreted.
        webhook:
          type: boolean
          default: false
          description: When true, enqueue the terminal assessment for every active endpoint in the same account and token environment that subscribes to the terminal event. If no active endpoint exists, the request returns WEBHOOK_NOT_CONFIGURED. Inline URLs are never accepted. Polling remains available independently.
  examples:
    ReleasedMeasurementAssessment:
      value:
        assessment_id: ra_22222222222222222222222222222222
        market_id: '1105752'
        status: released
        created_at: '2026-08-03T16:03:00.000Z'
        billable: false
        assessed_at: '2026-08-03T16:03:08.000Z'
        market:
          market_id: '1105752'
          title: Will the example market resolve?
          condition_id: null
          slug: example-market
        rules_snapshot:
          sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          captured_at: '2026-08-03T16:02:30.000Z'
        evidence_snapshot:
          sha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          book_as_of: '2026-08-03T16:02:45.000Z'
          universe_as_of: '2026-08-03T16:02:45.000Z'
        resolution_risk:
          classification: ELEVATED_RESOLUTION_RISK
          risk_basis: CALIBRATED
          confidence: MEDIUM
          modelled:
            dispute_probability: 0.31
            ambiguity_score: 0.62
        risk_factors:
          principal_reason_codes:
          - AMBIGUOUS_DEADLINE
          exact_rule_fragments:
          - The official source must confirm the result.
          alternative_interpretations:
          - Confirmation may occur after the named deadline.
          title_rules_mismatch: false
        provenance:
          record_schema: watch-record-v2
          model_version: rr2-v1
          limitations: []
        metering:
          disposition: measurement
          usage_event_id: usage-measurement-example
    FailedAssessment:
      value:
        assessment_id: ra_dddddddddddddddddddddddddddddddd
        market_id: '1105752'
        status: failed
        created_at: '2026-08-03T16:15:00.000Z'
        billable: false
        error:
          code: PROVIDER_UNAVAILABLE
          detail: The assessment provider was temporarily unavailable.
          retryable: true
    AcceptedAssessment:
      value:
        assessment_id: ra_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        market_id: '1105752'
        status: accepted
        created_at: '2026-08-03T16:00:00.000Z'
        billable: false
        customer_reference: case-2026-08-03
        status_url: https://scanverity.com/v1/resolution-assessments/ra_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        polling:
          recommended_interval_seconds: 3
          typical_completion_seconds: 10
    WithheldAssessment:
      value:
        assessment_id: ra_cccccccccccccccccccccccccccccccc
        market_id: '1105752'
        status: withheld
        created_at: '2026-08-03T16:10:00.000Z'
        billable: false
        withheld:
          code: WITHHELD_NO_RULES_TEXT
          could_not_verify: The market's decisive rules text could not be verified.
          reason: Publishing a resolution-risk assessment without verified rules would be unreliable.
          verified_facts: []
          retry:
            policy: retried when the blocking input changes and at the next scheduled assessment
    ReleasedCacheHitAssessment:
      value:
        assessment_id: ra_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        market_id: '1105752'
        status: released
        created_at: '2026-08-03T16:05:00.000Z'
        billable: false
        assessed_at: '2026-08-03T16:05:01.000Z'
        market:
          market_id: '1105752'
          title: Will the example market resolve?
          condition_id: null
          slug: example-market
        resolution_risk:
          classification: ELEVATED_RESOLUTION_RISK
          risk_basis: CALIBRATED
        risk_factors:
          principal_reason_codes: []
          exact_rule_fragments: []
          alternative_interpretations: []
        provenance:
          record_schema: watch-record-v2
          limitations: []
        metering:
          disposition: cache_hit
    ReleasedBillableAssessment:
      value:
        assessment_id: ra_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        market_id: '1105752'
        status: released
        created_at: '2026-08-03T16:00:00.000Z'
        billable: true
        customer_reference: case-2026-08-03
        assessed_at: '2026-08-03T16:00:08.000Z'
        market:
          market_id: '1105752'
          title: Will the example market resolve?
          condition_id: null
          slug: example-market
        resolution_risk:
          classification: ELEVATED_RESOLUTION_RISK
          risk_basis: CALIBRATED
          confidence: MEDIUM
          modelled:
            dispute_probability: 0.31
            ambiguity_score: 0.62
          calibrated_estimate:
            p_cal: 0.27
            bucket_n: 30
            model_version: rr2-v1
        risk_factors:
          principal_reason_codes:
          - AMBIGUOUS_DEADLINE
          exact_rule_fragments:
          - The official source must confirm the result.
          alternative_interpretations:
          - Confirmation may occur after the named deadline.
          title_rules_mismatch: false
        provenance:
          record_schema: watch-record-v2
          model_version: rr2-v1
          limitations:
          - The source carries no explicit publication schedule.
          evidence_freshness:
            rules_as_of: '2026-08-03T15:59:30.000Z'
            book_as_of: null
        metering:
          disposition: billable
