domain_standard:
  assessed: true
  standard: null
  conforms: false
  rationale: >-
    Prediction-market resolution intelligence has no published domain interchange standard. The
    market's own identifiers are proprietary to the venue -- the contract carries Polymarket
    condition_id as a 0x-prefixed 32-byte hex value and a numeric market_id -- and Polymarket
    publishes no schema this contract could declare conformance to. There is no FIX, ISO 20022,
    FDX or OpenRTB analogue for this surface. REWARD-ONLY check: recorded as no applicable standard
    rather than inventing one.
  probed_regimes: [fintech]
  note: >-
    The provider is a research/intelligence vendor, not a regulated financial institution. Its own
    documentation states the output is read-only research with no order execution, no custody and no
    trading advice, which places it outside PSD2/MiCA-style API mandates.

