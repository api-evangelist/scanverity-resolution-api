credit_behaviour: >-
  The monthly minimum works as usage credit -- included usage is never charged on top, and unused
  credit expires at the end of the billing period.
billing_predicate: >-
  A call bills only when status is released AND billable is true AND metering.disposition is
  billable.
never_billable:
  - idempotent duplicate
  - cache hit
  - read
  - poll
  - 4xx response
  - 5xx response
  - timeout
  - failed assessment
  - withheld assessment
  - webhook delivery, automatic retry or manual redelivery
  - sandbox call
usage_visibility:
